version: "3.8"

services:
  novel-reader:
    build: .
    container_name: nas-novel-reader
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NOVELS_DIR=/novels
      - DATA_DIR=/data
      # 選填：若想預設掛載 WebDAV 遠端資料夾，可取消註解並填寫以下變數（亦可直接在網頁右上角 UI 設定）
      # - WEBDAV_URL=http://192.168.1.100:5005
      # - WEBDAV_USERNAME=admin
      # - WEBDAV_PASSWORD=your_password
      # - WEBDAV_BASE_PATH=/novels
    volumes:
      # 將左側的 ./novels 替換為您 NAS 上的實際小說共用資料夾路徑，例如 /volume1/books 或 /share/Multimedia/novels
      - ./novels:/novels
      # 儲存跨裝置閱讀進度、書籤與 NAS 連線設定
      - ./data:/data
